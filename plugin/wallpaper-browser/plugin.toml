id = "computing/wallpaper-browser"
name = "Wallpaper Browser"
version = "1.2.1"
plugin_api = 30
author = "computing"
license = "MIT"
icon = "photo"
description = "Browse wallhaven.cc thumbnails and apply one by hand, instead of fetching a random wallpaper."
tags = ["wallpaper", "desktop", "theming"]
dependencies = ["curl", "bash", "xdg-open"]

[[panel]]
id = "browser"
entry = "panel.luau"
width = 1180
height = 780
placement = "floating"
position = "center"
layer = "overlay"

[[panel]]
id = "preview"
entry = "preview.luau"
width = 1200
height = 800
placement = "floating"
position = "center"
layer = "overlay"

[[shortcut]]
id = "open"
entry = "shortcut.luau"

[[widget]]
id = "button"
entry = "button.luau"
